cav_lidar_range: &id001
- -32
- -32
- -3
- 32
- 32
- 1
comm_range: 70
data_augment:
- ALONG_AXIS_LIST:
  - x
  NAME: random_world_flip
- NAME: random_world_rotation
  WORLD_ROT_ANGLE:
  - -0.78539816
  - 0.78539816
- NAME: random_world_scaling
  WORLD_SCALE_RANGE:
  - 0.95
  - 1.05
fusion:
  args:
    data_aug_conf: null
    grid_conf: null
    proj_first: false
  core_method: intermediateheter
  dataset: v2xsim
heter:
  assignment_path: null
  ego_modality: m1
  mapping_dict:
    m1: m1
    m2: m1
    m3: m1
    m4: m1
  modality_setting:
    m1:
      core_method: point_pillar
      preprocess:
        args:
          max_points_per_voxel: 32
          max_voxel_test: 70000
          max_voxel_train: 32000
          voxel_size:
          - 0.4
          - 0.4
          - 4
        cav_lidar_range: *id001
        core_method: SpVoxelPreprocessor
      sensor_type: lidar
input_source:
- lidar
label_type: lidar
loss:
  args:
    cls:
      alpha: 0.25
      gamma: 2.0
      type: SigmoidFocalLoss
      weight: 1.0
    depth:
      weight: 1.0
    dir:
      args:
        anchor_yaw:
        - 0
        - 90
        dir_offset: 0.7853
        num_bins: 2
      type: WeightedSoftmaxClassificationLoss
      weight: 0.2
    domain:
      batchsize: 8
      weight: 1.0
    pos_cls_weight: 2.0
    pyramid:
      relative_downsample:
      - 1
      weight:
      - 0.4
    reg:
      codewise: true
      sigma: 3.0
      type: WeightedSmoothL1Loss
      weight: 2.0
  core_method: point_pillar_pyramid_loss
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size:
  - 15
  - 30
model:
  args:
    anchor_number: 2
    dir_args:
      anchor_yaw:
      - 0
      - 90
      dir_offset: 0.7853
      num_bins: 2
    fusion_backbone:
      anchor_number: 2
      in_channels: 384
      layer_nums:
      - 1
      layer_strides:
      - 1
      num_filters:
      - 384
      num_upsample_filter:
      - 1
      resnext: false
      spatial_map_h: 80
      spatial_map_w: 80
      spatial_map_x_range:
      - -32
      - 32
      spatial_map_y_range:
      - -32
      - 32
      upsample_strides:
      - 1
    in_head: 384
    lidar_range: *id001
    m1:
      aligner_args:
        core_method: identity
      backbone_args:
        layer_nums:
        - 3
        - 5
        - 5
        layer_strides:
        - 2
        - 2
        - 2
        num_filters:
        - 64
        - 128
        - 256
        num_upsample_filter:
        - 128
        - 128
        - 128
        upsample_strides:
        - 1
        - 2
        - 4
      core_method: point_pillar
      encoder_args:
        lidar_range: *id001
        pillar_vfe:
          num_filters:
          - 64
          use_absolute_xyz: true
          use_norm: true
          with_distance: false
        point_pillar_scatter:
          grid_size: !!python/object/apply:numpy.core.multiarray._reconstruct
            args:
            - !!python/name:numpy.ndarray ''
            - !!python/tuple
              - 0
            - !!binary |
              Yg==
            state: !!python/tuple
            - 1
            - !!python/tuple
              - 3
            - !!python/object/apply:numpy.dtype
              args:
              - i8
              - false
              - true
              state: !!python/tuple
              - 3
              - <
              - null
              - null
              - null
              - -1
              - -1
              - 0
            - false
            - !!binary |
              oAAAAAAAAACgAAAAAAAAAAEAAAAAAAAA
          num_features: 64
        voxel_size:
        - 0.4
        - 0.4
        - 4
      sensor_type: lidar
    supervise_single: true
  core_method: DATA
name: DATA_v2xsim_pipeline
noise_setting: !!python/object/apply:collections.OrderedDict
- - - add_noise
    - false
optimizer:
  args:
    eps: 1.0e-10
    weight_decay: 0.0001
  core_method: Adam
  lr: 0.002
postprocess:
  anchor_args:
    D: 1
    H: 160
    W: 160
    cav_lidar_range: *id001
    feature_stride: 2
    h: 1.56
    l: 3.9
    num: 2
    r:
    - 0
    - 90
    vd: 4
    vh: 0.4
    vw: 0.4
    w: 1.6
  core_method: VoxelPostprocessor
  dir_args:
    anchor_yaw:
    - 0
    - 90
    dir_offset: 0.7853
    num_bins: 2
  gt_range: *id001
  max_num: 150
  nms_thresh: 0.15
  order: hwl
  target_args:
    neg_threshold: 0.45
    pos_threshold: 0.6
    score_threshold: 0.2
preprocess:
  args:
    max_points_per_voxel: 1
    max_voxel_test: 1
    max_voxel_train: 1
    voxel_size:
    - 0.4
    - 0.4
    - 4
  cav_lidar_range: *id001
  core_method: SpVoxelPreprocessor
root_dir: /raid/xuyifan/v2x_code_ckpt/datasets/v2xsim2_info/v2xsim_infos_train.pkl
test_dir: /raid/xuyifan/v2x_code_ckpt/datasets/v2xsim2_info/v2xsim_infos_test.pkl
train_params:
  batch_size: 8
  epoches: 40
  eval_freq: 1
  max_cav: 5
  save_freq: 1
  single_weight: 1
validate_dir: /raid/xuyifan/v2x_code_ckpt/datasets/v2xsim2_info/v2xsim_infos_val.pkl
yaml_parser: load_general_params
